<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin:0; width:100%; height:100%; overflow:hidden; background:transparent !important; }
  body { display:flex; align-items:center; justify-content:center; font-family:system-ui,-apple-system,"Segoe UI",sans-serif; }
  #stage { width:100%; height:100%; display:flex; align-items:center; justify-content:center; gap:7px; opacity:0; transform:translateY(3px) scale(.98); transition:opacity 170ms ease,transform 170ms ease; background:transparent; pointer-events:none; }
  #stage.active { opacity:1; transform:translateY(0) scale(1); }
  #orbCanvas { display:block; width:52px; height:52px; flex:0 0 52px; background:transparent; }
  #label { color:rgba(222,231,249,.74); font-size:11px; letter-spacing:.035em; white-space:nowrap; max-width:118px; overflow:hidden; text-overflow:ellipsis; }
  @media (prefers-reduced-motion: reduce) { #stage { transition:none; } }
</style>
<script src="thinking-orb-engine.js"></script>
</head>
<body>
<div id="stage" aria-live="polite"><canvas id="orbCanvas" width="104" height="104"></canvas><span id="label">Jarvis hazırlanıyor</span></div>
<script>
(function(){
  'use strict';
  const stage=document.getElementById('stage');
  const canvas=document.getElementById('orbCanvas');
  const label=document.getElementById('label');
  const ctx=canvas.getContext('2d',{alpha:true,desynchronized:true});
  const states=new Set(['working','searching','solving','listening','connecting','weaving','composing','breathing','shaping']);
  let state='working', live=false, raf=0, last=0;
  const labels={working:'Düşünüyor',searching:'Web’de arıyor',solving:'Dosyayı inceliyor',listening:'Dinliyor',connecting:'Bağlanıyor',weaving:'İşliyor',composing:'Yanıtı hazırlıyor',breathing:'Tamamlıyor',shaping:'Yanıtı düzenliyor'};
  function frame(now){
    raf=0; if(!live || document.visibilityState==='hidden') return;
    if(!last || now-last>=33){
      last=now;
      ctx.setTransform(2,0,0,2,0,0);ctx.clearRect(0,0,52,52);
      if(window.JarvisThinkingOrbEngine) window.JarvisThinkingOrbEngine.draw(ctx,state,52,(now||performance.now())/1000,true,.72);
    }
    raf=requestAnimationFrame(frame);
  }
  function start(){ if(live)return;live=true;stage.classList.add('active');if(!raf)raf=requestAnimationFrame(frame); }
  function stop(){ live=false;stage.classList.remove('active');if(raf)cancelAnimationFrame(raf);raf=0;ctx.clearRect(0,0,canvas.width,canvas.height); }
  window.setJarvisThinkingState=function(next,nextLabel){
    state=states.has(next)?next:'working';label.textContent=nextLabel||labels[state]||'Jarvis çalışıyor';start();
  };
  window.hideJarvisThinking=function(){stop();};
  document.addEventListener('visibilitychange',function(){ if(document.visibilityState==='visible'&&live&&!raf)raf=requestAnimationFrame(frame);else if(document.visibilityState==='hidden'&&raf){cancelAnimationFrame(raf);raf=0;} });
})();
</script>
</body>
</html>
