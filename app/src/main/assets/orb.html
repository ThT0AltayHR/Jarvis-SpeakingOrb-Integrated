<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="color-scheme" content="dark">
  <title>Jarvis</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { width:100%; height:100%; margin:0; padding:0; overflow:hidden; background:transparent; }
    body { display:flex; align-items:center; justify-content:center; -webkit-tap-highlight-color:transparent; }
    #orbRoot { position:relative; width:min(94vw, 420px); height:100%; aspect-ratio:auto; max-width:100%; max-height:100%; margin:auto; }
    speaking-orb { display:block; position:absolute; left:0; bottom:0; width:100%; --cap:#f7f3ff; --cap-dim:rgba(255,255,255,.48); --cap-font: system-ui, -apple-system, "Segoe UI", sans-serif; opacity:1; transition:opacity 180ms ease; }
    @media (max-height:320px) { #orbRoot { width:min(88vw, 300px); } }
    @media (prefers-reduced-motion: reduce) { speaking-orb { transition:none; } }
  </style>
  <script src="speaking-orb.js" defer></script>
</head>
<body>
  <div id="orbRoot">
    <speaking-orb id="jarvisOrb" state="done" rest="listening"></speaking-orb>
  </div>
  <script>
    (() => {
      'use strict';
      const orb = document.getElementById('jarvisOrb');
      const root = document.getElementById('orbRoot');
      // The home screen intentionally uses one enlarged Speaking Orb. The nine task
      // animations remain available in the chat UI; no second canvas covers the sphere here.
      const thinkingCanvas = null;
      const thinkingContext = null;
      const safeText = value => String(value == null ? '' : value).replace(/\s+/g, ' ').trim();
      const animationNames = new Set(['working','searching','solving','listening','connecting','weaving','composing','breathing','shaping']);
      const terminalTaskStates = new Set(['completed','failed','blocked','cancelled']);
      const taskAnimations = {
        understanding:'breathing',
        planning:'composing',
        observing:'searching',
        resolving_target:'searching',
        acting:'working',
        verifying:'solving',
        continuing:'weaving',
        replanning:'shaping',
        recovering:'shaping',
        waiting_for_ui:'connecting',
        paused:'breathing',
        blocked:'shaping',
        failed:'shaping',
        cancelled:'breathing'
      };
      const mapState = value => ({
        idle:'done', ready:'done', off:'done', listening:'listening',
        thinking:'thinking', searching:'searching', speaking:'speaking', done:'done'
      }[String(value || '').toLowerCase()] || 'listening');
      const animationLabels = {
        working:'Jarvis işlem yapıyor', searching:'Jarvis arıyor', solving:'Jarvis sonucu doğruluyor',
        listening:'Jarvis dinliyor', connecting:'Jarvis bağlantı kuruyor', weaving:'Jarvis adımları birleştiriyor',
        composing:'Jarvis plan hazırlıyor', breathing:'Jarvis düşünüyor', shaping:'Jarvis işlemi yeniden düzenliyor'
      };
      let currentText = '';
      let primaryState = 'done';
      let taskState = 'idle';
      let taskAnimation = null;
      let taskIsActive = false;
      let forcedAnimation = null;
      let themeForDots = 'dark';
      let cssSize = 0;
      let dpr = 1;
      let animationFrame = 0;
      let lastThinkingDrawMs = 0;
      const isAndroidWebView = /Android/i.test(navigator.userAgent || '');
      const thinkingFrameIntervalMs = isAndroidWebView ? (1000 / 30) : (1000 / 45);
      let completionToken = 0;
      let terminalTimer = 0;
      let isThinkingVisible = false;
      const reducedMotion = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);

      const clearText = () => {
        const line = orb && orb.line;
        // Text-generation completion can arrive before the final PCM sample is audible. Keep
        // the live line attached until AudioTrack ends so clearCaption cannot dust text midway
        // through a spoken answer. The caption renderer will perform the single final dust-out.
        if (line && line.externalSync && line.words && line.words.length &&
            (orb.externalAudioActive || line.waitingForPlayback || orb.externalAudioEndedAt !== null)) {
          currentText = '';
          line.clearRequested = true;
          return;
        }
        currentText = '';
        if (orb && typeof orb.dismissCaptionDust === 'function') orb.dismissCaptionDust();
        else if (orb && typeof orb.clearCaptionDust === 'function') orb.clearCaptionDust();
        if (orb) orb.line = null;
        if (orb && orb.capEl) {
          orb.capEl.textContent = '';
          if (orb.capEl.dataset) orb.capEl.dataset.g = '';
          orb.capEl.classList.remove('user');
        }
      };

      function desiredAnimation() {
        if (forcedAnimation) return forcedAnimation;
        if (taskAnimation && taskIsActive) return taskAnimation;
        if (primaryState === 'searching') return 'searching';
        if (primaryState === 'thinking') return 'working';
        if (primaryState === 'listening') return 'listening';
        return null;
      }

      function drawThinkingFrame(nowMs) {
        if (!thinkingContext || !thinkingCanvas || !isThinkingVisible) return;
        const engine = window.JarvisThinkingOrbEngine;
        const state = desiredAnimation();
        if (!engine || !state) return;
        if (!cssSize || !dpr) resizeThinkingCanvas();
        thinkingContext.setTransform(dpr, 0, 0, dpr, 0, 0);
        thinkingContext.clearRect(0, 0, cssSize, cssSize);
        engine.draw(thinkingContext, state, cssSize, (Number(nowMs) || performance.now()) / 1000, themeForDots !== 'light', 1);
      }

      function stopThinkingLoop() {
        if (animationFrame) cancelAnimationFrame(animationFrame);
        animationFrame = 0;
      }

      function thinkingLoop(nowMs) {
        animationFrame = 0;
        if (!isThinkingVisible || document.visibilityState === 'hidden') return;
        if (!lastThinkingDrawMs || nowMs - lastThinkingDrawMs >= thinkingFrameIntervalMs) {
          drawThinkingFrame(nowMs);
          lastThinkingDrawMs = nowMs;
        }
        if (!reducedMotion) animationFrame = requestAnimationFrame(thinkingLoop);
      }

      function startThinkingLoop() {
        stopThinkingLoop();
        if (!isThinkingVisible) return;
        lastThinkingDrawMs = 0;
        drawThinkingFrame(performance.now());
        lastThinkingDrawMs = performance.now();
        if (!reducedMotion && document.visibilityState !== 'hidden') animationFrame = requestAnimationFrame(thinkingLoop);
      }

      function resizeThinkingCanvas() {
        if (!thinkingCanvas || !root) return;
        const nextSize = Math.max(1, Math.floor(thinkingCanvas.clientWidth || root.clientWidth * 0.72 || 180));
        const deviceDpr = Math.max(1, Number(window.devicePixelRatio) || 1);
        // The status layer is decorative; avoid large high-DPI canvases on mobile GPUs.
        const nextDpr = Math.min(isAndroidWebView ? 1.35 : 2, deviceDpr);
        if (nextSize === cssSize && nextDpr === dpr) return;
        cssSize = nextSize;
        dpr = nextDpr;
        thinkingCanvas.width = Math.round(cssSize * dpr);
        thinkingCanvas.height = Math.round(cssSize * dpr);
        if (isThinkingVisible) drawThinkingFrame(performance.now());
      }

      function refreshThinkingVisibility() {
        // This screen has one deliberately large sphere; task animations are shown in Chat.
        // Keep the task-state bridge for native callers, but do not allocate or animate a second canvas.
        isThinkingVisible = false;
        stopThinkingLoop();
        if (root) root.classList.remove('thinking-active');
      }

      function clearTerminalTimer() {
        if (terminalTimer) window.clearTimeout(terminalTimer);
        terminalTimer = 0;
      }

      function scheduleTerminalClear(token, state) {
        clearTerminalTimer();
        // Do not consume the completion/error display time while the speaking orb is foregrounded.
        if (primaryState === 'speaking') return;
        terminalTimer = window.setTimeout(() => {
          terminalTimer = 0;
          if (completionToken !== token || primaryState === 'speaking') return;
          taskAnimation = null;
          taskIsActive = false;
          taskState = 'idle';
          refreshThinkingVisibility();
        }, state === 'completed' ? 1250 : 700);
      }

      function setPrimaryState(value) {
        const wasSpeaking = primaryState === 'speaking';
        primaryState = mapState(value);
        forcedAnimation = null;
        if (orb) orb.state = primaryState;
        if (wasSpeaking && primaryState !== 'speaking' && terminalTaskStates.has(taskState)) {
          scheduleTerminalClear(completionToken, taskState);
        }
        refreshThinkingVisibility();
      }

      function setTaskState(value) {
        taskState = String(value || 'idle').toLowerCase().replace(/[\s-]+/g, '_');
        completionToken++;
        const token = completionToken;
        clearTerminalTimer();
        if (taskState === 'idle') {
          taskIsActive = false;
          taskAnimation = null;
          refreshThinkingVisibility();
          return;
        }
        if (terminalTaskStates.has(taskState)) {
          taskIsActive = true;
          taskAnimation = taskState === 'completed' ? 'solving' : (taskAnimations[taskState] || 'shaping');
          refreshThinkingVisibility();
          scheduleTerminalClear(token, taskState);
          return;
        }
        taskIsActive = true;
        taskAnimation = taskAnimations[taskState] || 'working';
        refreshThinkingVisibility();
      }

      const appendText = value => {
        const next = safeText(value);
        if (!next) { clearText(); return; }
        if (!orb || !orb.estimate) return;
        if (!currentText || !next.startsWith(currentText)) {
          // A corrected/restarted transcript can begin without an intervening blank state.
          // Reset the DOM group key or a same-length next reply can accidentally keep old words.
          if (currentText && orb.capEl) {
            if (typeof orb.dismissCaptionDust === 'function') orb.dismissCaptionDust();
            orb.capEl.textContent = '';
            if (orb.capEl.dataset) orb.capEl.dataset.g = '';
          }
          currentText = '';
          // Text can arrive before AudioTrack starts. Do not seed a new line with
          // the previous response's playback position; re-anchor when this track starts.
          orb.line = {
            toks: [], words: [], t0: 0, live: true, who: 'assistant', externalSync: true,
            waitingForPlayback: !orb.externalAudioActive
          };
        }
        let delta = next.slice(currentText.length);
        if (delta && currentText && !/^\s/.test(delta)) {
          // Streaming updates can finish the currently forming word without adding another one.
          const line = orb.line;
          if (line && line.words.length && !/\s/.test(delta)) {
            const last = line.words[line.words.length - 1];
            last.w += delta;
            if (line.externalSync && !line.waitingForPlayback && orb.externalAudioActive) {
              last.end = Math.max(last.end, (Number(orb.externalAudioTime) || 0) + 0.12);
            }
            line.toks[line.toks.length - 1] = last.w;
            currentText = next;
            line.after = false;
            if (orb.externalAudioActive) setPrimaryState('speaking');
            return;
          }
        }
        const tokens = delta.trim().split(/\s+/).filter(Boolean);
        if (tokens.length) {
          const line = orb.line;
          const playbackTime = line.externalSync
            ? (line.waitingForPlayback ? 0 : Math.max(0, Number(orb.externalAudioTime) || 0))
            : Math.max(0, orb.time - line.t0);
          const lastWord = line.words[line.words.length - 1];
          let t = lastWord ? lastWord.end + 0.025 : playbackTime;
          if (line.externalSync && lastWord && playbackTime > lastWord.end + 0.06) {
            // Re-anchor each newly heard transcript chunk to the real AudioTrack playhead.
            // This stops estimated syllable lengths accumulating visible caption drift.
            t = Math.max(lastWord.start + 0.05, playbackTime - 0.08);
          }
          line.words.push(...orb.estimate(tokens, t));
          line.toks.push(...tokens);
          line.after = false;
        }
        currentText = next;
        // Transcript can arrive before playback. Keep the real conversation state until
        // AudioTrack confirms speech is audible; the dust line waits for its playhead too.
        if (orb.externalAudioActive) setPrimaryState('speaking');
      };

      window.JarvisOrb = {
        setState: setPrimaryState,
        setTaskState,
        // Optional direct API: choose any of the nine bundled animation presets.
        setThinkingAnimation: value => {
          const key = String(value || '').toLowerCase();
          forcedAnimation = animationNames.has(key) ? key : null;
          refreshThinkingVisibility();
        },
        clearThinkingAnimation: () => { forcedAnimation = null; refreshThinkingVisibility(); },
        setTheme: value => {
          const key = String(value || 'light').toLowerCase();
          const filters = { light:'saturate(.9)', dark:'hue-rotate(145deg) saturate(.95)', red:'hue-rotate(-36deg) saturate(1.45)', sunset:'hue-rotate(58deg) saturate(1.1)' };
          themeForDots = key === 'light' ? 'light' : 'dark';
          root.style.filter = filters[key] || 'none';
          if (isThinkingVisible) drawThinkingFrame(performance.now());
        },
        setBackground: value => {
          const hex = String(value || '').match(/^#?([0-9a-f]{6})$/i);
          if (!hex) return;
          const n = parseInt(hex[1], 16), r = n >> 16, g = (n >> 8) & 255, b = n & 255;
          const max = Math.max(r,g,b), min = Math.min(r,g,b), d = max-min;
          let h = 0;
          if (d) h = max===r ? ((g-b)/d)%6 : max===g ? (b-r)/d+2 : (r-g)/d+4;
          h = (h*60+360)%360;
          themeForDots = 'dark';
          root.style.filter = `hue-rotate(${Math.round((h-35+360)%360)}deg) saturate(1.15)`;
          if (isThinkingVisible) drawThinkingFrame(performance.now());
        },
        setExternalAudio: (amp, bass, high, playbackMs, playbackActive) => {
          if (!orb) return;
          const previousTime = Math.max(0, Number(orb.externalAudioTime) || 0);
          const wasActive = !!orb.externalAudioActive;
          const nextActive = typeof playbackActive === 'boolean' ? playbackActive : true;
          const clockMs = Number(playbackMs);
          const hasClock = Number.isFinite(clockMs) && clockMs >= 0;
          // Some playback-stop callbacks report 0. Preserve the last heard position until
          // a new AudioTrack starts, otherwise final captions jump backwards and vanish.
          const nextTime = nextActive && hasClock ? clockMs / 1000 : previousTime;
          // AudioTrack resets its playhead for a fresh response. If the transcript
          // arrived first, its words may be stamped with the last response's clock.
          // Rebuild their timeline as soon as the new playback starts or resets.
          const clockRestarted = nextActive && wasActive && nextTime + 0.20 < previousTime;
          const playbackStarted = nextActive && !wasActive;
          const line = orb.line;
          if (nextActive) {
            orb.externalAudioEndedAt = null;
          } else if (wasActive) {
            orb.externalAudioEndedAt = performance.now();
            orb.externalAudioEndTime = previousTime;
          }
          if ((playbackStarted || clockRestarted) && line && line.externalSync && line.words && line.words.length) {
            if (line.waitingForPlayback || clockRestarted || playbackStarted) {
              const words = line.words.map(word => word.w);
              const anchor = Math.max(0, nextTime - 0.04);
              line.words = orb.estimate(words, anchor);
              line.toks = words.slice();
                line.after = false;
              line.waitingForPlayback = false;
            }
          } else if (nextActive && line && line.externalSync && line.waitingForPlayback) {
            line.waitingForPlayback = false;
          }
          orb.level = Math.max(0, Math.min(1, Number(amp) || 0));
          orb.externalAudioLevel = orb.level;
          orb.externalAudioTime = nextTime;
          orb.externalAudioActive = nextActive;
          if (nextActive && primaryState !== 'speaking') setPrimaryState('speaking');
        },
        setCaption: value => { if (!orb || !orb.capEl) return; clearText(); orb.capEl.textContent = safeText(value); },
        appendText,
        clearCaption: clearText
      };

      document.addEventListener('visibilitychange', () => {
        if (!isThinkingVisible) return;
        if (document.visibilityState === 'hidden') stopThinkingLoop();
        else startThinkingLoop();
      });
      if (typeof ResizeObserver !== 'undefined' && root) new ResizeObserver(resizeThinkingCanvas).observe(root);
      else window.addEventListener('resize', resizeThinkingCanvas, { passive:true });
      resizeThinkingCanvas();
    })();
  </script>
</body>
</html>
